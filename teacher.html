<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Faculty Login - Geo Attendance</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:"Segoe UI", Arial, sans-serif;
}

/* NAVBAR */

.navbar{
width:100%;
background:#132c4b;
display:flex;
justify-content:space-between;
align-items:center;
padding:18px 60px;
color:white;
}

.logo{
display:flex;
align-items:center;
gap:10px;
font-size:20px;
font-weight:600;
}

.home-btn{
color:white;
text-decoration:none;
font-size:16px;
}

/* BACKGROUND */

body{
height:100vh;
background:
linear-gradient(rgba(0,0,0,0.3), rgba(0,0,0,0.3)),
url("bg.png");
background-size:cover;
background-position:center;
background-repeat:no-repeat;
display:flex;
flex-direction:column;
}

/* LOGIN CONTAINER */

.login-container{
flex:1;
display:flex;
justify-content:center;
align-items:center;
}

/* LOGIN BOX */

.login-box{
background:rgba(255,255,255,0.95);
padding:40px;
border-radius:12px;
width:350px;
box-shadow:0 10px 30px rgba(0,0,0,0.35);
text-align:center;
}

.login-box h2{
margin-bottom:25px;
color:#132c4b;
}

/* INPUT GROUP */

.input-group{
margin-bottom:18px;
text-align:left;
}

.input-group label{
font-size:14px;
font-weight:600;
}

.input-group input{
width:100%;
padding:10px;
margin-top:6px;
border-radius:6px;
border:1px solid #ccc;
font-size:14px;
outline:none;
}

.input-group input:focus{
border-color:#4facfe;
box-shadow:0 0 5px rgba(79,172,254,0.5);
}

/* BUTTON */

.login-btn{
width:100%;
padding:12px;
margin-top:10px;
border:none;
border-radius:6px;
background:#132c4b;
color:white;
font-size:16px;
cursor:pointer;
transition:0.3s;
}

.login-btn:hover{
background:#0b1f36;
}

</style>
</head>

<body>

<!-- NAVBAR -->

<div class="navbar">

<div class="logo">
<i class="fas fa-chalkboard-teacher"></i>
Geo Attend
</div>

<a href="index.html" class="home-btn">
<i class="fas fa-home"></i> Home
</a>

</div>

<!-- LOGIN FORM -->

<div class="login-container">

<div class="login-box">

<h2>Faculty Login</h2>

<div class="input-group">
<label>Subject Name</label>
<input type="text" id="subject" placeholder="Enter Subject Name">
</div>

<div class="input-group">
<label>Faculty Email</label>
<input type="email" id="email" placeholder="Enter Email">
</div>

<div class="input-group">
<label>Password</label>
<input type="password" id="password" placeholder="Enter Password">
</div>

<button class="login-btn" onclick="teacherLogin()">Login</button>

</div>

</div>

<script type="module" src="js/teacher-auth.js"></script>

</body>
</html>
