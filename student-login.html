<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Login - Geo Attendance</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins', sans-serif;
}

/* NAVBAR */

.navbar{
width:100%;
background:#132c4b;
display:flex;
justify-content:space-between;
align-items:center;
padding:18px 60px;
color:white;
}

.logo{
display:flex;
align-items:center;
gap:10px;
font-size:20px;
font-weight:600;
}

.home-btn{
color:white;
text-decoration:none;
font-size:16px;
}

/* BACKGROUND */

body{
min-height:100vh;
background:url("bg.png");
background-size:cover;
background-position:center;
background-repeat:no-repeat;
display:flex;
flex-direction:column;
}

/* LOGIN CONTAINER */

.login-container{
flex:1;
display:flex;
justify-content:center;
align-items:center;
}

/* LOGIN BOX */

.login-box{
background:rgba(255,255,255,0.95);
backdrop-filter:blur(10px);
padding:40px;
border-radius:16px;
width:350px;
box-shadow:0 15px 40px rgba(0,0,0,0.25);
text-align:center;
transition:0.3s;
}

.login-box:hover{
transform:translateY(-3px);
}

.login-box h2{
margin-bottom:25px;
color:#132c4b;
}

/* INPUT FIELDS */

.input-group{
margin-bottom:18px;
text-align:left;
}

.input-group label{
font-size:14px;
font-weight:600;
}

.input-group input{
width:100%;
padding:11px;
margin-top:6px;
border-radius:8px;
border:1px solid #ccc;
font-size:14px;
outline:none;
transition:0.3s;
}

.input-group input:focus{
border-color:#4facfe;
box-shadow:0 0 6px rgba(79,172,254,0.5);
}

/* LOGIN BUTTON */

.login-btn{
width:100%;
padding:13px;
margin-top:10px;
border:none;
border-radius:8px;
background:linear-gradient(135deg, #4facfe, #00c6ff);
color:white;
font-size:16px;
cursor:pointer;
transition:0.3s;
box-shadow:0 5px 15px rgba(0,0,0,0.2);
}

.login-btn:hover{
transform:scale(1.05);
box-shadow:0 8px 20px rgba(0,0,0,0.3);
}

</style>
</head>

<body>

<!-- NAVBAR -->

<div class="navbar">

<div class="logo">
<i class="fas fa-user-graduate"></i>
Geo Attend
</div>

<a href="geohome.html" class="home-btn">
<i class="fas fa-home"></i> Home
</a>

</div>

<!-- LOGIN FORM -->

<div class="login-container">

<div class="login-box">

<h2>Student Login</h2>

<div class="input-group">
<label>College Email</label>
<input id="email" type="email" placeholder="Enter College Email">
</div>

<div class="input-group">
<label>Password</label>
<input id="password" type="password" placeholder="Enter Password">
</div>

<button class="login-btn" onclick="login()">Login</button>

</div>

</div>

<script type="module" src="js/student-auth.js"></script>

</body>
</html>
