<!DOCTYPE html>
<html>

<head>

<title>Student Attendance - Geo Attendance</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins', sans-serif;
}

/* NAVBAR */

.navbar{
width:100%;
background:#132c4b;
display:flex;
justify-content:space-between;
align-items:center;
padding:18px 60px;
color:white;
}

.logo{
display:flex;
align-items:center;
gap:10px;
font-size:20px;
font-weight:600;
}

.home-btn{
color:white;
text-decoration:none;
font-size:16px;
}

/* BACKGROUND */

body{
min-height:100vh;
background:
linear-gradient(rgba(0,0,0,0.3), rgba(0,0,0,0.3)),
url("bg.png");
background-size:cover;
background-position:center;
background-repeat:no-repeat;
display:flex;
flex-direction:column;
}

/* CONTAINER */

.container{
flex:1;
display:flex;
justify-content:center;
align-items:center;
}

/* CARD */

.card{
background:rgba(255,255,255,0.95);
padding:30px;
border-radius:16px;
width:420px;
box-shadow:0 15px 40px rgba(0,0,0,0.25);
text-align:center;
}

/* TITLE */

h2{
margin-bottom:20px;
color:#132c4b;
}

/* CAMERA BOX (FIXED) */

.camera-box{
position:relative;
width:100%;
height:300px;
border-radius:12px;
overflow:hidden;
background:#000;
display:flex;
justify-content:center;
align-items:center;
}

/* VIDEO FIX */

#video{
width:100%;
height:100%;
object-fit:cover; /* 🔥 FIX */
}

/* CANVAS FIX */

#canvas{
position:absolute;
top:0;
left:0;
width:100%;
height:100%;
}

/* BUTTON */

.main-btn{
margin-top:20px;
padding:12px 20px;
border:none;
border-radius:8px;
background:linear-gradient(135deg, #4facfe, #00c6ff);
color:white;
font-size:15px;
cursor:pointer;
transition:0.3s;
}

.main-btn:hover{
transform:scale(1.05);
}

</style>

</head>

<body>

<!-- NAVBAR -->

<div class="navbar">

<div class="logo">
<i class="fas fa-user-graduate"></i>
Geo Attend
</div>

<a href="student-dashboard.html" class="home-btn">
<i class="fas fa-home"></i> Dashboard
</a>

</div>

<div class="container">

<div class="card">

<h2>Student Attendance</h2>

<!-- ✅ FIXED CAMERA ALIGNMENT -->
<div class="camera-box">

<video id="video" autoplay muted></video>

<canvas id="canvas"></canvas>

</div>

<button class="main-btn" onclick="markAttendance()">Mark Attendance</button>

</div>

</div>

<!-- FACE API LIBRARY -->
<script defer src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>

<!-- ATTENDANCE SCRIPT -->
<script type="module" src="js/attendance.js"></script>

</body>

</html>
